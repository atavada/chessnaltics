<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chessnaltics</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<h1>Chessnaltics</h1>
			<div class="depth-slider-container">
				<div class="depth-slider-header">
					<span class="depth-slider-label">Analysis Depth</span>
					<span class="depth-slider-value" id="depthValue">14</span>
				</div>
				<input type="range" id="depthSlider" min="10" max="22" value="14" step="1" />
				<div class="depth-slider-range">
					<span>10</span>
					<span>22</span>
				</div>
			</div>
			<div class="setting-group">
				<label class="setting-label" for="highlightStyle">Move Highlight</label>
				<div class="select-wrapper">
					<select id="highlightStyle" class="styled-select">
						<option value="filled">Blok Warna</option>
						<option value="outline">Outline Warna</option>
						<option value="off">Off</option>
					</select>
				</div>
			</div>
			<div class="setting-group">
				<label class="setting-label" for="multiPvCount">Recommendations</label>
				<div class="select-wrapper">
					<select id="multiPvCount" class="styled-select">
						<option value="1">1</option>
						<option value="3" selected>3</option>
						<option value="5">5</option>
					</select>
				</div>
			</div>
			<div class="button-group">
				<button id="analyze">Activate</button>
				<button id="reloadExtension" class="btn-secondary">Reload Extension</button>
			</div>
		</div>
		<script src="../js/extension-api.js"></script>
		<script src="../js/popup.js"></script>
	</body>
</html>
